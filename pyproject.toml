[project]
name = "klinikka-avustaja"
version = "0.1.0"
description = "LLMOps-demo: RAG-agentti kuvitteellisen lääkäriaseman asiakaspalveluun – evaluointi, tracing ja guardrailit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-ai-slim[openai]>=1.0",
    "chromadb>=1.0",
    "mlflow>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klinikka"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
